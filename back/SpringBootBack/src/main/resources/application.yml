server:
  port: 8080
  tomcat:
    max-swallow-size: 20MB

spring:
  application:
    name: SpringBootBack

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: SQLSTUDENT
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

external:
  api01:
    base-url: https://apis.data.go.kr/B552845/recent
    api-key: ${API01_KEY}

pexels:
  base-url: https://api.pexels.com/v1
  api-key: ${PEXELS_API_KEY}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5.4-mini

app:
  upload:
    root-directory: ${AGROLINK_UPLOAD_ROOT:../../uploads}
    product-directory: ${app.upload.root-directory}/product
    farm-directory: ${app.upload.root-directory}/farm

  seed:
    pexels-images: false

